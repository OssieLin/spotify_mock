<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spotify Mock Player</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <audio id="audio-player" src="Chopin_Waltz_in_A_flat_major_Op_42.mp3"></audio>
  <div class="date" id="date">Sunday, June 22</div>
  <div class="clock" id="clock">--:--</div>

  <div class="player">
    <div class="info">
      <img src="https://raw.githubusercontent.com/OssieLin/spotify_mock/main/chopin.png" class="album-art" alt="Chopin" />
      <div class="title">Waltz in A-Flat Major, Op. 42 </div>
      <div class="artist">Frederic Chopin</div>
    </div>
    <div class="timeline">
      <div class="time-text" id="current-time">0:00</div>
      <div class="range-wrapper">
        <div class="slider-bg"></div>
        <div class="slider-fill" id="slider-fill"></div>
        <input type="range" min="0" max="246" value="0" id="timeline" />
      </div>
      <div class="time-text" id="remaining-time">-4:00</div>
    </div>
    <div class="controls">
        <div id="prev-button"><i class="fas fa-backward"></i></div>
        <div id="play-button"><i class="fas fa-play"></i></div>
        <div id="next-button"><i class="fas fa-forward"></i></div>
      </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
